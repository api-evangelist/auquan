aid: auquan
name: Auquan
description: >-
  Auquan builds production-grade, autonomous AI agents for institutional finance —
  agentic systems that convert messy, global, unstructured data (earnings calls,
  ESG disclosures, filings, news across 2M+ sources in 76 languages) into
  auditable, decision-ready intelligence and fully-formed deliverables such as
  credit memos, IC memos, portfolio-monitoring alerts, sustainability reports and
  LP reporting. Its RAG-powered agents cover 550,000+ companies and entities and
  complete end-to-end workflows autonomously for banks, asset managers, private
  credit, insurers and other institutional clients. Founded by Chandini Jain (CEO)
  and Shub Jain (CTO) with offices in New York and London, Auquan is used by 40%
  of the top 50 financial institutions (MetLife, T. Rowe Price, BC Partners) and
  was named a Gartner 2025 Cool Vendor in Agentic AI. The platform is
  demo/sales-gated and publishes no public self-service API or developer portal.
